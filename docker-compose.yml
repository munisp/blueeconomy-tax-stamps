# Local development stack. NOT a production manifest: it exists so a
# developer can run the real dependencies (PostgreSQL, Redis, Kafka) and the
# env-gated integration tests locally. No secrets are stored here; the
# development signing key is generated by keys/README.md instructions and
# mounted from ./keys (git-ignored).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taxstamps
      POSTGRES_PASSWORD: taxstamps-local-dev
      POSTGRES_DB: taxstamps
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxstamps"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TAXSTAMPS_DATABASE_URL: postgresql+asyncpg://taxstamps:taxstamps-local-dev@postgres:5432/taxstamps
      TAXSTAMPS_REDIS_URL: redis://redis:6379/0
      TAXSTAMPS_SIGNING_KEY_PATH: /run/secrets/ed25519_pkcs8.pem
      TAXSTAMPS_KEY_DIRECTORY_PATH: /keys/directory.json
      TAXSTAMPS_ISSUER_DID: did:web:taxstamps.blueeconomy.gov.ng
      TAXSTAMPS_POLICY_DIR: /app/policies
      TAXSTAMPS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    secrets:
      - ed25519_pkcs8.pem
    volumes:
      - ./keys:/keys:ro
    ports:
      - "8080:8080"
    command: ["sh", "-c", "alembic upgrade head && taxstamps-api"]

secrets:
  ed25519_pkcs8.pem:
    file: ./keys/ed25519_pkcs8.pem
